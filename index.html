<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahedi, JS Weather App</title>


    <link rel="stylesheet" href="style.css">


</head>

<body>



    <div class="card">
        <div class="input_section">
            <input class="search_bar" spellcheck="false" placeholder="Enter city.....">
            <button><img src="images/search.jpg"></button>

        </div>

        <div class="invalid_city_name">
            <p>Invalid city name!!. correct it.</p>

        </div>


        <div class="weather_part">

            <div class="weather">
                <img src="images/clouds.png">
                <h1 class="temp">28°C</h1>
                <h2 class="city">Dhaka</h2>

            </div>


            <div class="details">


                <div class="col">
                    <img src="images/humidity_icon.png">
                    <div class="humidity_details">
                        <h2 class="humidity">90%</h2>
                        <p>Humidity</p>

                    </div>

                </div>






                <div class="col">
                    <img src="images/wind_icon.jpg">
                    <div class="humidity_details">
                        <h2 class="wind">56.6 km/h</h2>
                        <p>Wind Speed</p>

                    </div>

                </div>




            </div>
        </div>
    </div>

    <script src="script.js"></script>


</body>

</html>
